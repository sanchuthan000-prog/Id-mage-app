name: ff_id_manager
description: Free Fire ID Sale Management Application
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Database
  sqflite: ^2.3.3
  path: ^1.9.0
  
  # State Management
  provider: ^6.1.2
  
  # UI
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0
  fl_chart: ^0.69.0
  
  # Images
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1
  
  # File Operations
  path_provider: ^2.1.4
  share_plus: ^10.1.3
  file_picker: ^8.1.6
  
  # PDF & Excel Export
  pdf: ^3.11.1
  printing: ^5.13.1
  excel: ^4.0.6
  
  # Date/Time
  intl: ^0.19.0
  
  # Notifications & URL
  url_launcher: ^6.3.1
  
  # Utilities
  uuid: ^4.5.1
  crypto: ^3.0.5
  shared_preferences: ^2.3.3
  
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
