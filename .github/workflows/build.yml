name: Build & Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze --no-fatal-infos || true

      - name: Build APK (Debug - for testing)
        run: flutter build apk --debug

      - name: Build APK (Release)
        run: flutter build apk --release
        continue-on-error: true

      - name: Get version info
        id: version
        run: |
          VERSION=$(grep 'version:' pubspec.yaml | awk '{print $2}')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "date=$(date +'%Y%m%d-%H%M')" >> $GITHUB_OUTPUT

      - name: Upload Debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ff-id-manager-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: warn

      - name: Upload Release APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ff-id-manager-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: warn

      - name: Create Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}-${{ steps.version.outputs.date }}
          name: "FF ID Manager v${{ steps.version.outputs.version }}"
          body: |
            ## 🎮 Free Fire ID Manager
            
            ### Download
            - **app-release.apk** - Optimized release build (recommended)
            - **app-debug.apk** - Debug build (easier to sideload)
            
            ### Installation
            1. Download `app-release.apk`
            2. Enable "Install from unknown sources" in Android Settings
            3. Install the APK
            
            ### Features
            - Complete Free Fire ID management
            - Seller & Buyer management with balance tracking
            - DEO payment management
            - Financial reports with PDF/Excel export
            - WhatsApp integration
            - SQLite local database
          files: |
            build/app/outputs/flutter-apk/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
